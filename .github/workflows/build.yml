name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NoteStitch/NoteStitch.csproj

      - name: Build
        run: dotnet build NoteStitch/NoteStitch.csproj -c Release --no-restore

      - name: Publish
        run: >
          dotnet publish NoteStitch/NoteStitch.csproj
          -c Release
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.3 --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          [xml]$project = Get-Content NoteStitch/NoteStitch.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $publishDir = (Resolve-Path publish).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DPublishDir=$publishDir" `
            "/DMyAppVersion=$version" `
            "installer\NoteStitch.iss"

      - name: Stage installer artifact
        shell: pwsh
        run: Copy-Item artifacts/installer/NoteStitch-Setup.exe NoteStitch-Setup.exe -Force

      # The app is a multi-file self-contained WinUI 3 bundle; the bare apphost exe
      # cannot run alone. Ship the whole publish folder as a single runnable ZIP.
      - name: Package (zip)
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath NoteStitch.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: NoteStitch
          path: |
            NoteStitch.zip
            NoteStitch-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: NoteStitch
          path: dist
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/NoteStitch.zip \
            dist/NoteStitch-Setup.exe \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
