name: Publish to winget

# Runs after a GitHub Release is published (the build workflow attaches NoteStitch.zip).
# Uses winget-releaser (komac under the hood) to bump the manifest, recompute the SHA256
# from the release asset, and open a PR to microsoft/winget-pkgs.
#
# Prerequisites (one-time, manual):
#   1. Add a repo secret WINGET_TOKEN = a classic PAT with `public_repo` scope.
#      (The default GITHUB_TOKEN cannot fork winget-pkgs / open the cross-repo PR.)
#   2. Bootstrap the FIRST version into winget-pkgs once (run `komac new BDvirus.NoteStitch`
#      locally, or submit the winget/ manifests by hand). winget-releaser handles every
#      version after that automatically.

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Submit NoteStitch to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: BDvirus.NoteStitch
          # The release tag (vX.Y.Z) maps to PackageVersion X.Y.Z automatically.
          installers-regex: 'NoteStitch\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
